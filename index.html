<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ReelVault">
<title>ReelVault</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f0f0;min-height:100vh;overscroll-behavior:none;}
.app{max-width:430px;margin:0 auto;background:#f0f0f0;min-height:100vh;display:flex;flex-direction:column;}
.header{background:#fff;padding:14px 16px 0;position:sticky;top:0;z-index:100;box-shadow:0 1px 0 rgba(0,0,0,0.08);}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.logo{display:flex;align-items:center;gap:8px;}
.logo-dot{width:30px;height:30px;background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;}
.logo-text{font-size:18px;font-weight:700;background:linear-gradient(135deg,#dc2743,#bc1888);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.add-btn{background:linear-gradient(135deg,#dc2743,#bc1888);color:#fff;border:none;border-radius:20px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;}
.search-wrap{position:relative;margin-bottom:10px;}
.search-wrap input{width:100%;background:#f2f2f7;border:none;border-radius:12px;padding:10px 12px 10px 38px;font-size:15px;color:#000;outline:none;}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#8e8e93;font-size:16px;pointer-events:none;}
.search-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:#c7c7cc;border:none;border-radius:50%;width:18px;height:18px;font-size:11px;color:#fff;cursor:pointer;display:none;align-items:center;justify-content:center;}
.tabs{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;border-top:1px solid #f0f0f0;padding-top:2px;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex-shrink:0;padding:10px 14px;font-size:13px;font-weight:500;color:#8e8e93;border:none;background:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;}
.tab.active{color:#dc2743;border-bottom-color:#dc2743;}
.content{flex:1;padding:12px;overflow-y:auto;}
.stats-bar{display:flex;gap:8px;margin-bottom:14px;}
.stat{flex:1;background:#fff;border-radius:12px;padding:10px;text-align:center;}
.stat-num{font-size:20px;font-weight:700;color:#dc2743;}
.stat-lbl{font-size:11px;color:#8e8e93;margin-top:2px;}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.sec-title{font-size:12px;font-weight:600;color:#8e8e93;text-transform:uppercase;letter-spacing:0.05em;}
.new-col-btn{font-size:12px;font-weight:600;color:#dc2743;background:none;border:1.5px solid #dc2743;border-radius:8px;padding:4px 10px;cursor:pointer;}
.col-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px;}
.col-card{background:#fff;border-radius:14px;padding:14px 12px;cursor:pointer;border:2px solid transparent;position:relative;transition:border-color 0.15s;}
.col-card.active{border-color:#dc2743;}
.col-emoji{font-size:24px;margin-bottom:6px;display:block;}
.col-name{font-size:14px;font-weight:600;color:#000;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.col-cnt{font-size:12px;color:#8e8e93;}
.col-del{position:absolute;top:6px;right:8px;background:#ff3b30;border:none;border-radius:50%;width:20px;height:20px;color:#fff;font-size:11px;cursor:pointer;display:none;align-items:center;justify-content:center;}
.col-card:active .col-del,.col-card:hover .col-del{display:flex;}
.reels-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.reel-cnt{font-size:12px;color:#8e8e93;}
.reel-list{display:flex;flex-direction:column;gap:8px;}
.reel-card{background:#fff;border-radius:14px;padding:12px;display:flex;gap:10px;cursor:pointer;}
.reel-card:active{transform:scale(0.99);}
.thumb{width:48px;height:64px;border-radius:10px;background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px;position:relative;}
.play-icon{position:absolute;inset:0;background:rgba(0,0,0,0.2);border-radius:10px;display:flex;align-items:center;justify-content:center;}
.play-tri{border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:9px solid rgba(255,255,255,0.9);margin-left:2px;}
.reel-body{flex:1;min-width:0;}
.reel-title{font-size:14px;font-weight:500;color:#000;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.reel-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px;}
.tag{font-size:11px;background:#f2f2f7;color:#555;border-radius:5px;padding:2px 7px;}
.tag.hl{background:#fff0a0;color:#555;}
.col-badge{font-size:11px;color:#dc2743;background:#fff0f3;border-radius:5px;padding:2px 7px;display:inline-block;}
.owner{font-size:11px;color:#8e8e93;margin-top:2px;}
.reel-actions{display:flex;flex-direction:column;gap:5px;align-items:flex-end;flex-shrink:0;}
.icon-btn{background:none;border:1px solid #e5e5ea;border-radius:8px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;}
.empty{text-align:center;padding:50px 20px;color:#8e8e93;}
.empty-ico{font-size:48px;margin-bottom:12px;}
.empty-title{font-size:16px;font-weight:600;color:#3c3c43;margin-bottom:6px;}
.load-more{width:100%;margin-top:12px;padding:12px;background:#fff;border:1.5px solid #e5e5ea;border-radius:12px;font-size:14px;font-weight:500;color:#3c3c43;cursor:pointer;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;display:flex;align-items:flex-end;justify-content:center;}
.sheet{background:#fff;border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:430px;max-height:85vh;overflow-y:auto;}
.sheet-handle{width:36px;height:5px;background:#e5e5ea;border-radius:3px;margin:0 auto 18px;}
.sheet-title{font-size:18px;font-weight:700;color:#000;margin-bottom:18px;}
.fgrp{margin-bottom:14px;}
.flbl{font-size:12px;font-weight:600;color:#8e8e93;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:6px;display:block;}
.finput{width:100%;background:#f2f2f7;border:none;border-radius:10px;padding:11px 12px;font-size:15px;color:#000;outline:none;}
.finput:focus{box-shadow:0 0 0 2px #dc274340;}
.fselect{width:100%;background:#f2f2f7;border:none;border-radius:10px;padding:11px 12px;font-size:15px;color:#000;appearance:none;outline:none;}
.emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;}
.e-opt{font-size:22px;text-align:center;padding:8px;border-radius:10px;cursor:pointer;border:2px solid transparent;}
.e-opt.sel{border-color:#dc2743;background:#fff0f3;}
.sheet-btns{display:flex;gap:10px;margin-top:20px;}
.btn-cancel{flex:1;padding:13px;background:none;border:1.5px solid #e5e5ea;border-radius:12px;font-size:15px;cursor:pointer;color:#3c3c43;}
.btn-save{flex:2;padding:13px;background:linear-gradient(135deg,#dc2743,#bc1888);border:none;border-radius:12px;font-size:15px;font-weight:600;color:#fff;cursor:pointer;}
.btn-danger{flex:1;padding:13px;background:none;border:1.5px solid #ff3b30;border-radius:12px;font-size:15px;cursor:pointer;color:#ff3b30;}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);color:#fff;padding:10px 22px;border-radius:20px;font-size:14px;z-index:300;opacity:0;transition:opacity 0.2s;pointer-events:none;white-space:nowrap;}
.toast.on{opacity:1;}
mark{background:#fff176;border-radius:2px;padding:0;}
</style>
</head>

</div>

const JUNK = new Set(['fyp','foryou','reels','viral','explore','trending','instagram','instagood','reel','reach','fypシ']);
const PAGE = 40;

let collections = RAW.c.map(c => ({...c, userAdded: false}));
let reels = RAW.r.map(r => ({
  id:r[0], url:r[1], title:r[2],
  tags: r[3] ? r[3].split(',').filter(t => !JUNK.has(t)) : [],
  owner:r[4], colId:r[5], ts:r[6],
  notes:'', userAdded: false
}));

let activeCol = 'all';
let searchQ = '';
let page = 1;
let editId = null;
let selEmoji = '📁';
const EMOJIS = ['📁','🤖','🎨','❤️','📍','💼','🎬','💰','🌐','🍽️','🖼️','💪','💇','🍴','📚','⭐','✈️','🎵','🏋️','🐾','🌿','🎮','💻','📸'];

function save(){try{localStorage.setItem('rv2_c',JSON.stringify(collections.filter(c=>c.userAdded)));localStorage.setItem('rv2_r',JSON.stringify(reels.filter(r=>r.userAdded)));}catch(e){}}
function load(){
  try{
    const uc=localStorage.getItem('rv2_c');
    const ur=localStorage.getItem('rv2_r');
    if(uc) collections=[...collections,...JSON.parse(uc)];
    if(ur) reels=[...JSON.parse(ur),...reels];
  }catch(e){}
}

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2000);}

function doSearch(v){
  searchQ=v.trim().toLowerCase();
  document.getElementById('sc').style.display=searchQ?'flex':'none';
  page=1; render();
}
function clearSearch(){document.getElementById('sq').value='';doSearch('');}

function setCol(id){activeCol=id;searchQ='';document.getElementById('sq').value='';document.getElementById('sc').style.display='none';page=1;render();}

function filtered(){
  let r=reels;
  if(activeCol!=='all') r=r.filter(x=>x.colId===activeCol);
  if(searchQ) r=r.filter(x=>
    x.title.toLowerCase().includes(searchQ)||
    x.tags.some(t=>t.includes(searchQ))||
    (x.owner||'').toLowerCase().includes(searchQ)||
    (x.notes||'').toLowerCase().includes(searchQ)
  );
  return r;
}

function hl(txt){
  if(!searchQ) return esc(txt);
  const re=new RegExp('('+searchQ.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
  return esc(txt).replace(re,'<mark>$1</mark>');
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function tsAgo(ts){
  if(!ts) return '';
  const d=Math.floor((Date.now()/1000-ts)/86400);
  if(d===0) return 'Today';
  if(d===1) return 'Yesterday';
  if(d<30) return d+'d ago';
  if(d<365) return Math.floor(d/30)+'mo ago';
  return Math.floor(d/365)+'y ago';
}

function renderTabs(){
  const all=[{id:'all',name:'All',cnt:reels.length},...collections.map(c=>({id:c.id,name:c.name,cnt:reels.filter(r=>r.colId===c.id).length})),{id:'u',name:'Uncategorized',cnt:reels.filter(r=>r.colId==='u').length}];
  document.getElementById('tabs').innerHTML=all.map(t=>`<button class="tab ${activeCol===t.id?'active':''}" onclick="setCol('${t.id}')">${t.name} (${t.cnt})</button>`).join('');
}

function render(){
  renderTabs();
  const f=filtered();
  const slice=f.slice(0,page*PAGE);
  let h='';

  if(!searchQ && activeCol==='all'){
    h+=`<div class="stats-bar">
      <div class="stat"><div class="stat-num">${reels.length}</div><div class="stat-lbl">Total Reels</div></div>
      <div class="stat"><div class="stat-num">${collections.length}</div><div class="stat-lbl">Collections</div></div>
    </div>`;
    h+=`<div class="sec-hdr"><span class="sec-title">Collections</span><button class="new-col-btn" onclick="openAddCol()">+ New</button></div>`;
    h+=`<div class="col-grid">`;
    collections.forEach(c=>{
      const cnt=reels.filter(r=>r.colId===c.id).length;
      h+=`<div class="col-card ${activeCol===c.id?'active':''}" onclick="setCol('${c.id}')">
        <span class="col-emoji">${c.emoji}</span>
        <div class="col-name">${esc(c.name)}</div>
        <div class="col-cnt">${cnt} reel${cnt!==1?'s':''}</div>
        ${c.userAdded?`<button class="col-del" onclick="event.stopPropagation();delCol('${c.id}')">✕</button>`:''}
      </div>`;
    });
    h+=`</div>`;
  }

  const label=searchQ?`Results for "${searchQ}"`:(activeCol==='all'?'All Reels':activeCol==='u'?'Uncategorized':(collections.find(c=>c.id===activeCol)?.name||'Reels'));
  h+=`<div class="reels-hdr"><span class="sec-title">${esc(label)}</span><span class="reel-cnt">${f.length} reels</span></div>`;

  if(f.length===0){
    h+=`<div class="empty"><div class="empty-ico">${searchQ?'🔍':'📭'}</div><div class="empty-title">${searchQ?'No results found':'No reels here'}</div><div>${searchQ?'Try different keywords':'Add your first reel!'}</div></div>`;
  } else {
    h+=`<div class="reel-list">`;
    slice.forEach(r=>{
      const col=collections.find(c=>c.id===r.colId);
      const cleanTags=r.tags.filter(t=>!JUNK.has(t)).slice(0,4);
      h+=`<div class="reel-card" onclick="openReel('${r.id}')">
        <div class="thumb">${col?col.emoji:'🎬'}<div class="play-icon"><div class="play-tri"></div></div></div>
        <div class="reel-body">
          <div class="reel-title">${hl(r.title)}</div>
          ${cleanTags.length?`<div class="reel-tags">${cleanTags.map(t=>`<span class="tag ${searchQ&&t.includes(searchQ)?'hl':''}">#${esc(t)}</span>`).join('')}</div>`:''}
          ${col?`<span class="col-badge">${col.emoji} ${esc(col.name)}</span>`:''}
          <div class="owner">@${esc(r.owner||'unknown')} · ${tsAgo(r.ts)}</div>
        </div>
        <div class="reel-actions">
          <button class="icon-btn" onclick="event.stopPropagation();editReel('${r.id}')">✏️</button>
          <button class="icon-btn" onclick="event.stopPropagation();delReel('${r.id}')">🗑️</button>
        </div>
      </div>`;
    });
    h+=`</div>`;
    if(f.length>page*PAGE){
      h+=`<button class="load-more" onclick="page++;render()">Load more (${f.length-page*PAGE} remaining)</button>`;
    }
  }
  document.getElementById('content').innerHTML=h;
}

function openReel(id){
  const r=reels.find(x=>x.id===id);
  if(!r) return;
  const col=collections.find(c=>c.id===r.colId);
  showSheet(`
    <div class="sheet-handle"></div>
    <div class="sheet-title">🎬 ${esc(r.title)}</div>
    <div style="font-size:13px;color:#8e8e93;word-break:break-all;margin-bottom:10px;">${esc(r.url)}</div>
    ${col?`<div style="margin-bottom:10px;"><span class="col-badge">${col.emoji} ${esc(col.name)}</span></div>`:''}
    ${r.tags.length?`<div class="reel-tags" style="margin-bottom:12px;">${r.tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div>`:''}
    ${r.notes?`<div style="background:#f2f2f7;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px;">${esc(r.notes)}</div>`:''}
    <div class="sheet-btns">
      <button class="btn-cancel" onclick="closeSheet()">Close</button>
      <button class="btn-save" onclick="window.open('${esc(r.url)}','_blank');closeSheet()">Open Instagram ↗</button>
    </div>
  `);
}

function openAdd(){
  editId=null;
  showSheet(`
    <div class="sheet-handle"></div>
    <div class="sheet-title">Save a Reel</div>
    <div class="fgrp"><label class="flbl">Instagram URL</label><input type="url" id="f_url" class="finput" placeholder="https://www.instagram.com/reel/..." /></div>
    <div class="fgrp"><label class="flbl">Title / Description</label><input type="text" id="f_title" class="finput" placeholder="What is this reel about?" /></div>
    <div class="fgrp"><label class="flbl">Tags (comma separated)</label><input type="text" id="f_tags" class="finput" placeholder="cooking, recipe, pasta" /></div>
    <div class="fgrp"><label class="flbl">Collection</label><select id="f_col" class="fselect">${collections.map(c=>`<option value="${c.id}">${c.emoji} ${esc(c.name)}</option>`).join('')}<option value="u">📁 Uncategorized</option></select></div>
    <div class="fgrp"><label class="flbl">Notes (optional)</label><input type="text" id="f_notes" class="finput" placeholder="Reminder for yourself..." /></div>
    <div class="sheet-btns"><button class="btn-cancel" onclick="closeSheet()">Cancel</button><button class="btn-save" onclick="saveReel()">Save Reel</button></div>
  `);
}

function editReel(id){
  editId=id;
  const r=reels.find(x=>x.id===id);
  if(!r) return;
  showSheet(`
    <div class="sheet-handle"></div>
    <div class="sheet-title">Edit Reel</div>
    <div class="fgrp"><label class="flbl">Title</label><input type="text" id="f_title" class="finput" value="${esc(r.title)}" /></div>
    <div class="fgrp"><label class="flbl">Tags</label><input type="text" id="f_tags" class="finput" value="${esc(r.tags.join(', '))}" /></div>
    <div class="fgrp"><label class="flbl">Collection</label><select id="f_col" class="fselect">${collections.map(c=>`<option value="${c.id}" ${r.colId===c.id?'selected':''}>${c.emoji} ${esc(c.name)}</option>`).join('')}<option value="u" ${r.colId==='u'?'selected':''}>📁 Uncategorized</option></select></div>
    <div class="fgrp"><label class="flbl">Notes</label><input type="text" id="f_notes" class="finput" value="${esc(r.notes||'')}" /></div>
    <div class="sheet-btns"><button class="btn-danger" onclick="delReel('${id}');closeSheet()">Delete</button><button class="btn-save" onclick="saveReel()">Update</button></div>
  `);
}

function saveReel(){
  const title=document.getElementById('f_title').value.trim();
  const colId=document.getElementById('f_col').value;
  const notes=document.getElementById('f_notes').value.trim();
  const tags=(document.getElementById('f_tags').value||'').split(',').map(t=>t.trim().toLowerCase().replace(/^#/,'')).filter(Boolean);
  if(!title){toast('Please add a title');return;}
  if(editId){
    const r=reels.find(x=>x.id===editId);
    if(r){r.title=title;r.tags=tags;r.colId=colId;r.notes=notes;}
    toast('Updated!');
  } else {
    const url=(document.getElementById('f_url')||{}).value||'';
    if(!url){toast('Please add a URL');return;}
    reels.unshift({id:'r'+Date.now(),url,title,tags,owner:'',colId,notes,ts:Math.floor(Date.now()/1000),userAdded:true});
    toast('Saved!');
  }
  save();closeSheet();render();
}

function delReel(id){reels=reels.filter(r=>r.id!==id);save();render();toast('Deleted');}

function delCol(id){
  if(reels.some(r=>r.colId===id)){toast('Move reels to another collection first');return;}
  collections=collections.filter(c=>c.id!==id);
  if(activeCol===id) activeCol='all';
  save();render();toast('Collection deleted');
}

function openAddCol(){
  selEmoji='📁';
  showSheet(`
    <div class="sheet-handle"></div>
    <div class="sheet-title">New Collection</div>
    <div class="fgrp"><label class="flbl">Name</label><input type="text" id="c_name" class="finput" placeholder="e.g. Travel, Recipes..." /></div>
    <div class="fgrp"><label class="flbl">Icon</label><div class="emoji-grid">${EMOJIS.map((e,i)=>`<div class="e-opt ${i===0?'sel':''}" onclick="pickEmoji(this,'${e}')">${e}</div>`).join('')}</div></div>
    <div class="sheet-btns"><button class="btn-cancel" onclick="closeSheet()">Cancel</button><button class="btn-save" onclick="saveCol()">Create</button></div>
  `);
}

function pickEmoji(el,e){document.querySelectorAll('.e-opt').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');selEmoji=e;}

function saveCol(){
  const name=document.getElementById('c_name').value.trim();
  if(!name){toast('Please enter a name');return;}
  const cid='uc'+Date.now();
  collections.push({id:cid,name,emoji:selEmoji,userAdded:true});
  save();closeSheet();render();toast('Collection created!');
}

function showSheet(html){
  closeSheet();
  const o=document.createElement('div');
  o.className='overlay';o.id='overlay';
  o.onclick=e=>{if(e.target===o)closeSheet();};
  const s=document.createElement('div');
  s.className='sheet';s.innerHTML=html;
  o.appendChild(s);document.body.appendChild(o);
}
function closeSheet(){const o=document.getElementById('overlay');if(o)o.remove();}

load();render();
</script>
</body>
</html>
